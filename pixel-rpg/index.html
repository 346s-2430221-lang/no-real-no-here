<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>별빛 숲 RPG</title>
<style>
:root{--ink:#18253b;--cream:#f7edcf;--gold:#f6c85f;--mint:#7be0b2}*{box-sizing:border-box}body{margin:0;background:#101827;color:var(--cream);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:12px}#app{width:min(100%,960px)}header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 10px}h1{font-size:clamp(18px,4vw,28px);margin:0;color:#ffe18a;text-shadow:3px 3px #6b3d68;letter-spacing:1px}.tag{font-size:11px;color:#b8cbe8}#gamebox{position:relative;border:4px solid #d8c99d;border-radius:8px;overflow:hidden;background:#192e36;box-shadow:0 0 0 4px #43556a,0 14px 40px #0009}canvas{display:block;width:100%;height:auto;image-rendering:pixelated;touch-action:none}#hud{display:flex;gap:8px;flex-wrap:wrap;padding:10px;background:#202e43;border:2px solid #425674;margin-top:10px;border-radius:6px;font-size:12px}.stat{flex:1;min-width:110px}.bar{height:9px;background:#101827;border:1px solid #71819a;margin-top:4px}.fill{height:100%;width:100%;transition:width .15s}.hp{background:#ef6675}.xp{background:#72d9b0}.gold{color:#ffda73}.panelrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.panel{padding:10px;background:#202e43;border:2px solid #425674;border-radius:6px;font-size:12px;line-height:1.6}.panel h2{font-size:13px;color:#ffe18a;margin:0 0 5px}.panel p{margin:0}.hint{color:#a8bbd5}button{font:inherit;color:#fff4d4;background:#354967;border:2px solid #7087a6;border-radius:5px;padding:8px 10px;cursor:pointer;touch-action:manipulation}button:active{transform:translateY(1px);background:#536c8d}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}#toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#101827eF;border:2px solid #f6c85f;padding:8px 12px;border-radius:5px;font-size:12px;white-space:normal;text-align:center;width:max-content;max-width:90%;display:none}#mobile{display:none;justify-content:space-between;align-items:end;gap:10px;margin-top:10px;user-select:none}.dpad{display:grid;grid-template-columns:42px 42px 42px;grid-template-rows:42px 42px 42px;gap:4px}.dpad button{padding:0;font-size:18px}.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}.actbtn{height:54px;min-width:65px;border-radius:50%;background:#77475c;border-color:#dc8ca6}.small{font-size:11px;color:#adbed5;margin-top:8px}@media(max-width:650px){.panelrow{grid-template-columns:1fr}#mobile{display:flex}#hud{font-size:11px}.tag{display:none}}
</style>
</head>
<body><main id="app"><header><h1>✦ 별빛 숲 RPG ✦</h1><span class="tag">PIXEL ADVENTURE · DEMO 1.0</span></header>
<div id="gamebox"><canvas id="game" width="640" height="400" aria-label="별빛 숲 픽셀 RPG 게임 화면"></canvas><div id="toast"></div></div>
<div id="hud"><div class="stat">❤️ HP <b id="hptext">5 / 5</b><div class="bar"><div id="hpbar" class="fill hp"></div></div></div><div class="stat">✦ 경험치 <b id="xptext">0 / 5</b><div class="bar"><div id="xpbar" class="fill xp"></div></div></div><div class="stat">🪙 골드 <b id="gold">0</b></div><div class="stat">⚔️ 레벨 <b id="level">1</b></div></div>
<div class="panelrow"><section class="panel"><h2>📜 모험 일지</h2><p id="quest">숲의 슬라임을 3마리 처치하자! (0/3)</p><div class="actions"><button id="potion">🧪 포션 사용 (1)</button><button id="save">💾 저장</button><button id="reset">↻ 새 모험</button></div></section><section class="panel"><h2>🧭 조작법 / 팁</h2><p>이동: <b>WASD / 방향키</b> · 공격: <b>Space</b></p><p>반짝이는 상자에 다가가 <b>E</b>를 눌러 보물 획득!</p><p class="hint">슬라임은 가까이 다가오면 쫓아와요. HP가 0이 되면 마을에서 다시 시작합니다.</p></section></div>
<div id="mobile"><div class="dpad"><button class="up" data-key="ArrowUp">▲</button><button class="left" data-key="ArrowLeft">◀</button><button class="down" data-key="ArrowDown">▼</button><button class="right" data-key="ArrowRight">▶</button></div><div style="display:flex;gap:8px"><button class="actbtn" data-key="Space">⚔️<br>공격</button><button class="actbtn" data-key="KeyE">📦<br>줍기</button></div></div><div class="small">이 게임은 브라우저에서 바로 실행됩니다. 진행 상황은 이 기기의 브라우저에 저장할 수 있어요.</div></main>
<script>
(()=>{'use strict';
const c=document.getElementById('game'),ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;
const W=640,H=400,T=32,keys=new Set();let player,slimes,chest,particles,questKills,gold,potions,level,xp,toastTimer,last=0,attack=0,gameOver=false;
const obstacles=[];for(let x=0;x<20;x++){obstacles.push([x,0],[x,12]);}for(let y=1;y<12;y++)obstacles.push([0,y],[19,y]);[[5,3],[6,3],[5,4],[13,3],[14,3],[13,4],[4,8],[5,8],[14,8],[15,8],[8,2],[9,2],[10,9],[11,9]].forEach(p=>obstacles.push(p));
const solid=new Set(obstacles.map(p=>p.join(',')));function blocked(x,y){let tx=Math.floor(x/T),ty=Math.floor(y/T);return solid.has(tx+','+ty)||tx<0||ty<0||tx>=20||ty>=12}
function say(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.display='none',1900)}
function start(){player={x:320,y:245,dir:'down',hp:5,max:5,inv:0};slimes=[{x:150,y:125,hp:2,alive:true,hit:0},{x:480,y:135,hp:2,alive:true,hit:0},{x:290,y:315,hp:2,alive:true,hit:0},{x:520,y:300,hp:2,alive:true,hit:0}];chest={x:560,y:75,open:false};particles=[];questKills=0;gold=0;potions=1;level=1;xp=0;attack=0;gameOver=false;updateHUD()}
function rect(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
function tile(x,y,col){rect(x*T,y*T,T,T,col)}
function drawWorld(){for(let y=0;y<13;y++)for(let x=0;x<20;x++){let n=(x*7+y*13+x*y)%5;tile(x,y,['#315b4d','#35614e','#38664f','#315849','#3a624d'][n]);if((x*3+y*5)%7===0){rect(x*T+7,y*T+8,3,3,'#50795a');rect(x*T+21,y*T+22,2,2,'#254a43')}if((x+y*2)%11===0){rect(x*T+12,y*T+25,3,3,'#e7d59a')}}for(const [x,y] of obstacles){if(x===0||y===0||x===19||y===12){rect(x*T,y*T,T,T,'#1d3542');rect(x*T+3,y*T+3,26,26,'#294959');rect(x*T+7,y*T+6,18,4,'#476576')}else{rect(x*T,y*T,T,T,'#1c423d');rect(x*T+3,y*T+7,26,21,'#234d40');rect(x*T+5,y*T+2,22,14,'#377653');rect(x*T+10,y*T+4,5,5,'#6fa75f');rect(x*T+9,y*T+25,14,5,'#79593e')}}// path
for(let x=1;x<19;x++)for(let y=5;y<8;y++){if(!solid.has(x+','+y)){tile(x,y,'#8b7954');rect(x*T+4,y*T+8,5,3,'#a99769')}}}
function drawHero(x,y,dir){rect(x-7,y+7,14,8,'#172a35');rect(x-6,y-9,12,16,'#477fd1');rect(x-8,y-5,4,11,'#f0c28a');rect(x+4,y-5,4,11,'#f0c28a');rect(x-6,y-17,12,10,'#e8b982');rect(x-7,y-20,14,6,'#6c493e');rect(x-6,y-22,11,4,'#9a6947');if(dir==='left'||dir==='right'){rect(x+(dir==='left'?-5:2),y-13,3,3,'#263449')}else{rect(x-4,y-14,3,3,'#263449');rect(x+2,y-14,3,3,'#263449')}if(attack>0){ctx.save();ctx.globalAlpha=.85;ctx.strokeStyle='#fff3a4';ctx.lineWidth=4;ctx.beginPath();ctx.arc(x,y-1,20,dir==='left'?2.4:dir==='up'?3.7:dir==='right'?5.5:.5,dir==='left'?4.4:dir==='up'?5.7:dir==='right'?7.5:2.5);ctx.stroke();ctx.restore()}}
function drawSlime(s){if(!s.alive)return;let bob=Math.sin(Date.now()/160+s.x)*2;rect(s.x-12,s.y+7+bob,24,9,'#21483e');rect(s.x-12,s.y-2+bob,24,12,'#6de0a5');rect(s.x-8,s.y-8+bob,16,10,'#6de0a5');rect(s.x-5,s.y-3+bob,3,4,'#193c46');rect(s.x+3,s.y-3+bob,3,4,'#193c46');rect(s.x-8,s.y+5+bob,16,3,'#9affbd');if(s.hp<2){rect(s.x-12,s.y-15,24,3,'#352f42');rect(s.x-12,s.y-15,12,3,'#f2787b')}}
function drawChest(){let x=chest.x,y=chest.y;rect(x-12,y-6,24,17,chest.open?'#795c4b':'#a66b3e');rect(x-12,y-9,24,7,chest.open?'#60483f':'#d79b4b');rect(x-2,y-6,4,12,'#f7d76c');if(!chest.open){rect(x-15,y-18,30,2,'#ffe58b');rect(x-1,y-22,2,4,'#ffe58b')}}
function draw(){ctx.clearRect(0,0,W,H);drawWorld();drawChest();slimes.forEach(drawSlime);drawHero(player.x,player.y,player.dir);particles.forEach(p=>{rect(p.x,p.y,3,3,p.col)});ctx.fillStyle='#f8e9b9';ctx.font='10px monospace';ctx.fillText('별빛 숲',14,18);ctx.fillStyle='#172b37aa';ctx.fillRect(450,8,176,22);ctx.fillStyle='#f7e7bc';ctx.fillText('SLIMES '+slimes.filter(s=>s.alive).length+'  ·  TREASURE '+(chest.open?'OPEN':'???'),458,22);if(gameOver){ctx.fillStyle='#101827bb';ctx.fillRect(0,0,W,H);ctx.fillStyle='#ffe18a';ctx.font='bold 26px monospace';ctx.fillText('모험가가 쓰러졌다!',180,180);ctx.font='14px monospace';ctx.fillStyle='#fff4d4';ctx.fillText('Space 또는 새 모험 버튼으로 다시 시작',150,212)}}
function updateHUD(){document.getElementById('hptext').textContent=player.hp+' / '+player.max;document.getElementById('hpbar').style.width=player.hp/player.max*100+'%';document.getElementById('xptext').textContent=xp+' / '+(level*5);document.getElementById('xpbar').style.width=xp/(level*5)*100+'%';document.getElementById('gold').textContent=gold;document.getElementById('level').textContent=level;document.getElementById('potion').textContent='🧪 포션 사용 ('+potions+')';document.getElementById('quest').textContent=questKills>=3?'✨ 의뢰 완료! 보상: 골드 '+gold+' · 숲을 계속 탐험해 보자!':'숲의 슬라임을 3마리 처치하자! ('+Math.min(questKills,3)+'/3)'}
function attackNow(){if(gameOver){start();say('새 모험을 시작했어!');return}if(attack>0)return;attack=12;let hit=0;for(const s of slimes){if(!s.alive)continue;let dx=s.x-player.x,dy=s.y-player.y,front=player.dir==='up'?dy<0&&Math.abs(dx)<33&&Math.abs(dy)<45:player.dir==='down'?dy>0&&Math.abs(dx)<33&&Math.abs(dy)<45:player.dir==='left'?dx<0&&Math.abs(dy)<33&&Math.abs(dx)<45:dx>0&&Math.abs(dy)<33&&Math.abs(dx)<45;if(front){s.hp--;s.hit=10;hit++;particles.push({x:s.x,y:s.y-12,col:'#ffe18a'});if(s.hp<=0){s.alive=false;questKills++;gold+=3;xp++;if(xp>=level*5){xp=0;level++;player.max++;player.hp=player.max;say('레벨 업! 레벨 '+level+' · HP가 회복됐어!')}else say('슬라임 처치! +3 골드, +1 EXP')}else say('명중! 한 번 더 공격해!')}}if(!hit)say('조금 더 가까이 다가가 봐!');updateHUD()}
function interact(){if(Math.hypot(player.x-chest.x,player.y-chest.y)<45){if(chest.open)say('상자는 이미 비어 있어.');else{chest.open=true;gold+=15;potions++;say('보물 발견! +15 골드, 포션 +1');updateHUD()}}else say('상자 가까이 다가가서 E를 눌러 봐!')}
function step(dt){if(gameOver)return;let dx=0,dy=0;if(keys.has('ArrowLeft')||keys.has('KeyA')){dx--;player.dir='left'}if(keys.has('ArrowRight')||keys.has('KeyD')){dx++;player.dir='right'}if(keys.has('ArrowUp')||keys.has('KeyW')){dy--;player.dir='up'}if(keys.has('ArrowDown')||keys.has('KeyS')){dy++;player.dir='down'}let len=Math.hypot(dx,dy)||1,speed=105*dt/1000;let nx=player.x+dx/len*speed,ny=player.y+dy/len*speed;if(!blocked(nx,player.y))player.x=nx;if(!blocked(player.x,ny))player.y=ny;if(player.inv>0)player.inv-=dt;if(attack>0)attack-=dt/16;for(const s of slimes){if(!s.alive)continue;let d=Math.hypot(player.x-s.x,player.y-s.y);if(d<125&&d>20){let sx=(player.x-s.x)/d*32*dt/1000,sy=(player.y-s.y)/d*32*dt/1000;if(!blocked(s.x+sx,s.y))s.x+=sx;if(!blocked(s.x,s.y+sy))s.y+=sy}if(d<19&&player.inv<=0){player.hp--;player.inv=1000;player.x=Math.max(48,Math.min(590,player.x+(player.x-s.x)*.7));player.y=Math.max(48,Math.min(350,player.y+(player.y-s.y)*.7));say('앗! 슬라임에게 부딪혔어!');if(player.hp<=0){gameOver=true;say('쓰러졌어! Space로 다시 시작')}updateHUD()}}particles=particles.filter(p=>{p.y-=.6;p.life=(p.life||10)-1;return p.life>0});}
function loop(t){let dt=Math.min(40,t-last||16);last=t;step(dt);draw();requestAnimationFrame(loop)}
document.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();if(!keys.has(e.code)){if(e.code==='Space')attackNow();if(e.code==='KeyE')interact()}keys.add(e.code)});document.addEventListener('keyup',e=>keys.delete(e.code));document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;const on=e=>{e.preventDefault();if(k==='Space')attackNow();else if(k==='KeyE')interact();else keys.add(k)};const off=e=>{e.preventDefault();keys.delete(k)};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off)});
document.getElementById('potion').onclick=()=>{if(potions>0&&player.hp<player.max){potions--;player.hp=Math.min(player.max,player.hp+3);say('포션을 사용했어! HP 회복');updateHUD()}else say(potions===0?'포션이 없어! 상자를 찾아봐.':'HP가 이미 가득 차 있어!')};
document.getElementById('save').onclick=()=>{localStorage.setItem('starlightRpgSave',JSON.stringify({player,slimes,chest,questKills,gold,potions,level,xp}));say('이 기기에 모험을 저장했어!')};
document.getElementById('reset').onclick=()=>{if(confirm('새 모험을 시작할까? 저장하지 않은 진행은 사라져.')){start();say('새 모험 출발!')}};
try{let s=JSON.parse(localStorage.getItem('starlightRpgSave'));if(s&&s.player&&Array.isArray(s.slimes)){({player,slimes,chest,questKills,gold,potions,level,xp}=s);particles=[];attack=0;gameOver=false;updateHUD()}else start()}catch{start()}requestAnimationFrame(loop);
})();
</script></body></html>
