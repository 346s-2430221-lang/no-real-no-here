services:
  - type: web
    name: no-real-no-here-server
    runtime: node
    plan: free
    buildCommand: npm install --prefix server
    startCommand: npm start --prefix server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MAX_PLAYERS
        value: "4"
      - key: MAX_SPEED
        value: "7"
